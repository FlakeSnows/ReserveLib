spring.application.name=reservelib
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lib_db}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.db.enabled=${MANAGEMENT_HEALTH_DB_ENABLED:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

books.provider.api-key=${BOOKS_API_KEY}
books.provider.base-url=https://www.googleapis.com/books/v1/volumes
books.search.publisher-keywords=\u043B\u0438\u0442\u0440\u0435\u0441,litres

irbis.provider.base-url=${IRBIS_BASE_URL:https://webirbis.ekmob.ru/cgi-bin/cgiirbis_64.exe}
irbis.provider.database=${IRBIS_DATABASE:WEBS_SIMPLE}
irbis.provider.encoding=${IRBIS_ENCODING:windows-1251}
irbis.provider.timeout-seconds=${IRBIS_TIMEOUT_SECONDS:5}
irbis.provider.insecure=${IRBIS_INSECURE:true}
irbis.search.limit=${IRBIS_LIMIT:20}

# Logging configuration
logging.level.root=INFO
logging.level.com.example.reservelib=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
