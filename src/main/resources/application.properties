spring.application.name=reservelib
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:2593/library}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Andrey}
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.db.enabled=${MANAGEMENT_HEALTH_DB_ENABLED:false}

books.provider.api-key=${BOOKS_API_KEY:}
books.provider.base-url=https://www.googleapis.com/books/v1/volumes
books.search.publisher-keywords=\u043B\u0438\u0442\u0440\u0435\u0441,litres
yandex.maps.provider.api-key=${YANDEX_MAPS_API_KEY:}
yandex.maps.provider.base-url=https://geocode-maps.yandex.ru/1.x/

irbis.provider.base-url=${IRBIS_BASE_URL:https://webirbis.ekmob.ru/cgi-bin/cgiirbis_64.exe}
irbis.provider.database=${IRBIS_DATABASE:WEBS_SIMPLE}
irbis.provider.encoding=${IRBIS_ENCODING:utf-8}
irbis.provider.timeout-seconds=${IRBIS_TIMEOUT_SECONDS:20}
irbis.provider.insecure=${IRBIS_INSECURE:true}
irbis.search.limit=${IRBIS_LIMIT:20}
irbis.search.deep-scan=${IRBIS_DEEP_SCAN:false}
irbis.search.workers=${IRBIS_WORKERS:8}
